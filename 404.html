<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>الصفحة مو موجودة | تاج كلاس</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/taj-class/assets/mark.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@300;500&family=Aref+Ruqaa:wght@700&display=swap" rel="stylesheet">
<style>
  :root { --night: #1A130B; --gold-hi: #E9CF8A; --pearl: #FBFAF6; }
  body {
    margin: 0; min-height: 100svh; display: grid; place-items: center; text-align: center;
    background: radial-gradient(120% 80% at 50% 45%, #2A1F12 0%, var(--night) 60%);
    color: var(--pearl); font-family: "Alexandria", system-ui, sans-serif; font-weight: 300; padding: 24px;
  }
  img { height: 160px; width: auto; margin: 0 auto 24px; display: block; }
  h1 { font-family: "Aref Ruqaa", serif; font-size: clamp(2rem, 6vw, 3.2rem); color: var(--gold-hi); margin: 0 0 .3em; }
  p { margin: 0 0 1.8em; opacity: .8; }
  a {
    display: inline-flex; align-items: center; min-height: 48px; padding: 0 1.8em; border-radius: 999px;
    background: linear-gradient(160deg, #F3DE9E, #D4AE5A 38%, #A8812F 70%, #E2C47A); color: var(--night);
    text-decoration: none; font-weight: 500;
  }
  a:focus-visible { outline: 2px solid var(--gold-hi); outline-offset: 3px; }
</style>
</head>
<body>
  <main>
    <img src="/taj-class/assets/mark.svg" alt="">
    <h1>هالصفحة مو موجودة</h1>
    <p>يمكن الرابط قديم أو فيه غلطة. الحلويات كلها بالصفحة الرئيسية.</p>
    <a href="/taj-class/">ارجع للصفحة الرئيسية</a>
  </main>
</body>
</html>
